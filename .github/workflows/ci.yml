name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # TODO: there are no unit tests yet, so this passes with "[no test files]".
      - name: Unit tests
        run: go test ./...

  release:
    # Only for commits that landed on main, never for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, the version below counts commits
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/archmage-linux-x86_64 .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same scheme as a pacman VCS pkgver: r<commit count>.<short sha>
          version="r$(git rev-list --count HEAD).$(git rev-parse --short=7 HEAD)"
          gh release create "$version" dist/* \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --generate-notes
